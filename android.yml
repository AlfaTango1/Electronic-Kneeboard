name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Copy map library into the app
        run: npm run prepare-www

      - name: Create Android project
        run: |
          npx cap add android
          bash scripts/patch-android.sh

      - name: App icon
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --assetPath assets

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FlightMissionNavigator.apk

      - name: Upload APK (Actions → this run → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: FlightMissionNavigator-apk
          path: FlightMissionNavigator.apk

      - name: Attach APK to release (only for tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FlightMissionNavigator.apk
